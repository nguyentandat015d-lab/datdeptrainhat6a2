
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Surprise 6A2</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* ẢNH NỀN ĐẾM NGƯỢC */

#intro {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(#0003, #0005),
        url("./background.png") center center / cover no-repeat;

    z-index: 10;
}

#countdown {
    color: white;
    font-size: clamp(100px, 25vw, 220px);
    font-weight: 900;

    text-shadow:
        0 0 15px white,
        0 0 40px #00aaff;

    animation: zoom 1s ease;
}

@keyframes zoom {
    0% {
        opacity: 0;
        transform: scale(2);
    }

    60% {
        opacity: 1;
        transform: scale(0.9);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* MÀN HÌNH VIDEO */

#videoScreen {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: black;
}

#myVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* NÚT BẬT TIẾNG DỰ PHÒNG */

#soundPrompt {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 5;

    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 18px;

    color: white;
    text-align: center;
    background: #000b;
    padding: 20px;
}

#soundPrompt button {
    padding: 16px 28px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

/* THÔNG BÁO LỖI */

#error {
    display: none;
    position: fixed;
    inset: 0;

    justify-content: center;
    align-items: center;

    color: white;
    background: black;
    text-align: center;
    padding: 25px;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- MÀN HÌNH ĐẾM NGƯỢC -->

<div id="intro">
    <div id="countdown">3</div>
</div>

<!-- MÀN HÌNH VIDEO -->

<div id="videoScreen">

    <video
        id="myVideo"
        playsinline
        controls
        preload="auto"
    >
        <source src="./video.mp4" type="video/mp4">
    </video>

    <!-- NÚT BẬT TIẾNG NẾU TRÌNH DUYỆT CHẶN -->

    <div id="soundPrompt">
        <h2>Video đã sẵn sàng!</h2>
        <p>Nhấn bên dưới để phát video có âm thanh.</p>

        <button id="soundButton">
            🔊 BẬT ÂM THANH
        </button>
    </div>

</div>

<!-- THÔNG BÁO LỖI -->

<div id="error">
    Không thể tải video!<br>
    Hãy kiểm tra file video.mp4 trên GitHub.
</div>

<script>

// LẤY CÁC THÀNH PHẦN

const intro = document.getElementById("intro");
const countdown = document.getElementById("countdown");
const videoScreen = document.getElementById("videoScreen");
const video = document.getElementById("myVideo");
const error = document.getElementById("error");
const soundPrompt = document.getElementById("soundPrompt");
const soundButton = document.getElementById("soundButton");

// BẮT ĐẦU ĐẾM NGƯỢC

let number = 3;

function countDown() {

    countdown.textContent = number;

    countdown.style.animation = "none";
    void countdown.offsetWidth;
    countdown.style.animation = "zoom 1s ease";

    if (number > 1) {

        number--;

        setTimeout(countDown, 1000);

    } else {

        setTimeout(startVideo, 1000);

    }
}

// CHUYỂN SANG VIDEO

function startVideo() {

    intro.style.display = "none";
    videoScreen.style.display = "flex";

    video.muted = false;
    video.volume = 1;

    video.load();

    // THỬ TỰ PHÁT CÓ TIẾNG

    video.play().then(() => {

        soundPrompt.style.display = "none";

    }).catch((err) => {

        console.log("Trình duyệt chặn tự phát:", err);

        soundPrompt.style.display = "flex";

    });

}

// NÚT BẬT ÂM THANH DỰ PHÒNG

soundButton.addEventListener("click", async function () {

    video.muted = false;
    video.volume = 1;

    try {

        await video.play();

        soundPrompt.style.display = "none";

    } catch (err) {

        alert("Không thể phát video. Hãy kiểm tra lại file video.mp4.");

    }

});

// KIỂM TRA LỖI VIDEO

video.addEventListener("error", function () {

    videoScreen.style.display = "none";
    error.style.display = "flex";

});

// CHẠY WEBSITE

countDown();

</script>

</body>
</html>
