
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise 6A2</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* MÀN HÌNH ĐẾM NGƯỢC */
#intro {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(#0003, #0005),
        url("./background.png") center center / cover no-repeat;
    z-index: 10;
}

#countdown {
    color: white;
    font-size: clamp(100px, 25vw, 220px);
    font-weight: 900;
    text-shadow:
        0 0 15px white,
        0 0 40px #00aaff;
    animation: zoom 1s ease;
}

@keyframes zoom {
    0% {
        opacity: 0;
        transform: scale(2);
    }
    60% {
        opacity: 1;
        transform: scale(0.9);
    }
    100% {
        opacity: 1;
        transform: scale(1);
    }
}

/* MÀN HÌNH VIDEO */
#videoScreen {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    background: black;
}

#myVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
}

/* THÔNG BÁO LỖI */
#error {
    display: none;
    position: fixed;
    inset: 0;
    color: white;
    background: black;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- MÀN HÌNH ĐẾM NGƯỢC -->
<div id="intro">
    <div id="countdown">3</div>
</div>

<!-- MÀN HÌNH VIDEO -->
<div id="videoScreen">
    <video id="myVideo" playsinline controls preload="auto">
        <source src="./video.mp4" type="video/mp4">
    </video>
</div>

<div id="error">
    Không thể tải video!<br>
    Hãy kiểm tra lại file video.mp4 trên GitHub.
</div>

<script>
const intro = document.getElementById("intro");
const countdown = document.getElementById("countdown");
const videoScreen = document.getElementById("videoScreen");
const video = document.getElementById("myVideo");
const error = document.getElementById("error");

let number = 3;

// HIỆU ỨNG ĐẾM NGƯỢC
const timer = setInterval(() => {

    number--;

    if (number > 0) {
        countdown.textContent = number;

        countdown.style.animation = "none";
        void countdown.offsetWidth;
        countdown.style.animation = "zoom 1s ease";

    } else {

        clearInterval(timer);

        // ẨN ẢNH NỀN
        intro.style.display = "none";

        // HIỆN VIDEO
        videoScreen.style.display = "flex";

        // CHUẨN BỊ VIDEO
        video.muted = true;
        video.load();

        // KHI VIDEO TẢI ĐƯỢC
        video.onloadeddata = () => {

            video.play().then(() => {

                // THỬ TOÀN MÀN HÌNH
                const fullscreen =
                    videoScreen.requestFullscreen ||
                    videoScreen.webkitRequestFullscreen;

                if (fullscreen) {
                    fullscreen.call(videoScreen).catch(() => {});
                }

            }).catch(() => {
                video.controls = true;
            });
        };

        // NẾU VIDEO BỊ LỖI
        video.onerror = () => {
            videoScreen.style.display = "none";
            error.style.display = "flex";
        };
    }

}, 1000);

</script>

</body>
</html>
